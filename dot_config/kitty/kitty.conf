# Terminal behavior
enable_audio_bell no
enabled_layouts splits, tall, fat

# Paste Handy's regular clipboard into Kitty and Herdr panes
map shift+insert paste_from_clipboard

# Manual window splitting
map ctrl+shift+alt+enter launch --location=hsplit --cwd=current
dynamic_background_opacity yes
allow_remote_control yes
listen_on unix:/tmp/mykitty


# Fonts
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

# CougarCS branch icons (cougarcs-tui): single-cell E900-E903 + 5x5 tiles E910-E988
symbol_map U+E900-U+E988 CougarCS Icons

# Tabs conf
include tabs.conf

# BEGIN_KITTY_THEME
# Moonfly
include current-theme.conf
# END_KITTY_THEME
