# Terminal behavior
enable_audio_bell no
enabled_layouts splits, tall, fat

# Paste Handy's regular clipboard into Kitty and Herdr panes
map shift+insert paste_from_clipboard

# Manual window splitting and pane management, ported from Konsole's default
# shortcuts (Konsole has no user overrides on this system, so these are its
# stock defaults).
map ctrl+parenleft launch --location=hsplit --cwd=current
map ctrl+parenright launch --location=vsplit --cwd=current
map ctrl+shift+e toggle_layout stack
map ctrl+shift+bracketright resize_window wider 2
map ctrl+shift+bracketleft resize_window narrower 2
map ctrl+shift+backslash layout_action equalize
map ctrl+shift+h detach_window
dynamic_background_opacity yes
allow_remote_control yes
listen_on unix:/tmp/mykitty


# Fonts
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

# CougarCS branch icons (cougarcs-tui): single-cell E900-E903 + 5x5 tiles E910-E988
symbol_map U+E900-U+E988 CougarCS Icons

# Tabs conf
include tabs.conf

# BEGIN_KITTY_THEME
# Moonfly
include current-theme.conf
# END_KITTY_THEME
